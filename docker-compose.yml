version: '3.8'

services:
  backend:
    build: ./backend
    container_name: codex-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=change-this-in-production
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: codex-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host
